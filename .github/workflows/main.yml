name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        
      - name: Build APK (Debug)
        run: ./gradlew :androidApp:assembleDebug
        
      - name: Build APK (Release unsigned)
        run: ./gradlew :androidApp:assembleRelease
        
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: androidApp/build/outputs/apk/foss/debug/
          retention-days: 30
          
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: androidApp/build/outputs/apk/foss/release/
          retention-days: 30
          
      - name: Create Release Summary
        run: |
          echo "## APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Debug APKs" >> $GITHUB_STEP_SUMMARY
          ls -lh androidApp/build/outputs/apk/foss/debug/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release APKs" >> $GITHUB_STEP_SUMMARY
          ls -lh androidApp/build/outputs/apk/foss/release/ >> $GITHUB_STEP_SUMMARY
